name: update

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/keywords.json"  # the profile lives in the private repo; it applies on the next run
      - "collector/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package-lock.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Always the latest main: a queued run must not collect on top of an older commit.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The recommendation profile is private (Sweet-Butters/private-kit). It is copied to the
      # git-ignored config/profile.json for this run only: the collector and the web build read it,
      # and only derived fit scores are published. No secret or no access -> default profile.
      - name: Private profile
        env:
          PRIVATE_KIT_TOKEN: ${{ secrets.PRIVATE_KIT_TOKEN }}
        run: |
          if [ -z "$PRIVATE_KIT_TOKEN" ]; then
            echo "::notice::PRIVATE_KIT_TOKEN is not set; using the default recommendation profile"
            exit 0
          fi
          url=https://api.github.com/repos/Sweet-Butters/private-kit/contents/profile.json
          if ! curl -fsS -H "Authorization: Bearer $PRIVATE_KIT_TOKEN" -H "Accept: application/vnd.github.raw" -o config/profile.json "$url" \
             || ! python -c "import json; json.load(open('config/profile.json', encoding='utf-8'))"; then
            echo "::warning::could not read profile.json from private-kit; using the default recommendation profile"
            rm -f config/profile.json
          fi

      - name: Collect
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m collector.main

      # Mondays: re-check a sample of deadlines against the sources and publish the hit rate.
      - name: Audit deadlines
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then python -m collector.audit; fi

      - name: Calendar feeds
        run: python -m collector.ics

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: update $(TZ=Asia/Seoul date +%F)"
            git pull --rebase -X theirs origin main  # on a data conflict keep this run's fresh data
            git push origin HEAD:main
          fi

      - name: Notify (Telegram)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m collector.notify

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web + admin
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
          node scripts/assemble.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
